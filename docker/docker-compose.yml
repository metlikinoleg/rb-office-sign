version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: rb-office-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - /tmp/rb-office:/tmp

networks:
  default:
    name: rb-office-network
    external: true
