version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: rb-office-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - /tmp/rb-office:/tmp
      - rb-office-documents:/app/documents
      - rb-office-signatures:/app/signatures

volumes:
  rb-office-documents:
  rb-office-signatures:

networks:
  default:
    name: rb-office-network
    external: true
