<!DOCTYPE html>
<html lang="ru" style="height:100%;margin:0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RB-Office — Редактор</title>
  <link rel="stylesheet" href="style.css">
  <script src="http://85.239.61.19/web-apps/apps/api/documents/api.js"></script>
</head>
<body style="height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column">

<div class="editor-toolbar" id="editorToolbar" style="flex-shrink:0">
  <button class="btn btn-secondary" onclick="location.href='index.html'">&larr; Назад</button>
  <span class="doc-title" id="docTitle">Загрузка...</span>
  <button class="btn btn-success" id="btnSign" onclick="signDoc()">Подписать</button>
  <button class="btn btn-info" id="btnVerify" onclick="verifyDoc()">Проверить подпись</button>
</div>

<div id="editor-container" style="flex:1;overflow:hidden"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <pre id="modalBody"></pre>
    <button class="btn btn-secondary close-btn" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const params = new URLSearchParams(window.location.search);
const docId = params.get('id');

function toast(msg, type) {
  type = type || 'success';
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + type + ' visible';
  setTimeout(function() { el.classList.remove('visible'); }, 3000);
}

function showModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent =
    typeof body === 'string' ? body : JSON.stringify(body, null, 2);
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeModal();
});

if (!docId) {
  document.getElementById('docTitle').textContent = 'Ошибка: не указан ID документа';
} else {
  initEditor();
}

// Inject persistent CSS rule for iframe sizing — survives DOM manipulation
(function() {
  var style = document.createElement('style');
  style.textContent = 'iframe[name="frameEditor"] { height: calc(100vh - 48px) !important; width: 100% !important; border: none !important; display: block !important; }';
  document.head.appendChild(style);
})();

async function initEditor() {
  try {
    var res = await fetch(API + '/documents/' + docId + '/editor-config');
    if (!res.ok) throw new Error(await res.text());
    var config = await res.json();

    document.getElementById('docTitle').textContent = config.document.title;

    var toolbarEl = document.querySelector('.editor-toolbar');
    var editorH = window.innerHeight - (toolbarEl ? toolbarEl.offsetHeight : 48);
    config.height = editorH + 'px';
    config.width = '100%';

    new DocsAPI.DocEditor('editor-container', config);

    // Also poll with inline function to apply via JS as backup
    var attempts = 0;
    var timer = setInterval(function() {
      var frame = document.querySelector('iframe[name="frameEditor"]');
      if (frame) {
        var tb = document.querySelector('.editor-toolbar');
        var h = tb ? tb.offsetHeight : 48;
        frame.style.setProperty('height', (window.innerHeight - h) + 'px', 'important');
      }
      attempts++;
      if (attempts > 150) clearInterval(timer);
    }, 200);

    window.addEventListener('resize', function() {
      var frame = document.querySelector('iframe[name="frameEditor"]');
      if (frame) {
        var tb = document.querySelector('.editor-toolbar');
        var h = tb ? tb.offsetHeight : 48;
        frame.style.setProperty('height', (window.innerHeight - h) + 'px', 'important');
      }
    });
  } catch (e) {
    document.getElementById('docTitle').textContent = 'Ошибка загрузки: ' + e.message;
  }
}

async function signDoc() {
  var btn = document.getElementById('btnSign');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Подписание...';
  try {
    var res = await fetch(API + '/documents/' + docId + '/sign', { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    var data = await res.json();
    toast('Документ подписан: ' + (data.signer || ''));
  } catch (e) {
    toast('Ошибка подписания: ' + e.message, 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Подписать';
}

async function verifyDoc() {
  var btn = document.getElementById('btnVerify');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Проверка...';
  try {
    var res = await fetch(API + '/documents/' + docId + '/verify', { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    var data = await res.json();
    showModal('Результат проверки подписи', data);
  } catch (e) {
    toast('Ошибка проверки: ' + e.message, 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Проверить подпись';
}
</script>
</body>
</html>
