<!DOCTYPE html>
<html lang="ru" style="height:100%;margin:0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RB-Office — Редактор</title>
  <link rel="stylesheet" href="style.css">
  <script src="http://85.239.61.19/web-apps/apps/api/documents/api.js"></script>
  <script defer src="/app/cadesplugin_api.js?v=2"></script>
  <script defer src="/app/sign-local.js?v=2"></script>
</head>
<body style="height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column">

<div class="editor-toolbar" id="editorToolbar" style="flex-shrink:0">
  <button class="btn btn-secondary" onclick="location.href='index.html'">&larr; Назад</button>
  <span class="doc-title" id="docTitle">Загрузка...</span>
  <button class="btn btn-success" id="btnSign" onclick="signDoc()" style="display:none">Подписать</button>
  <button class="btn btn-success" id="btnDownloadPdf" onclick="downloadPdf()" style="display:none">Скачать PDF</button>
  <button class="btn btn-info" id="btnVerify" onclick="verifyDoc()">Проверить подпись</button>
</div>

<div id="signedBanner" style="display:none;background:#e8f6ea;border-bottom:1px solid #b8dcc0;color:#1a5f27;padding:10px 16px;font-size:14px;flex-shrink:0"></div>

<div id="editor-container" style="flex:1;overflow:hidden"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <pre id="modalBody"></pre>
    <button class="btn btn-secondary close-btn" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
const params = new URLSearchParams(window.location.search);
const docId = params.get('id');

function toast(msg, type) {
  type = type || 'success';
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + type + ' visible';
  setTimeout(function() { el.classList.remove('visible'); }, 3000);
}

function showModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent =
    typeof body === 'string' ? body : JSON.stringify(body, null, 2);
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeModal();
});

if (!docId) {
  document.getElementById('docTitle').textContent = 'Ошибка: не указан ID документа';
} else {
  initEditor();
}

// Inject persistent CSS rule for iframe sizing — survives DOM manipulation
(function() {
  var style = document.createElement('style');
  style.textContent = 'iframe[name="frameEditor"] { height: calc(100vh - 48px) !important; width: 100% !important; border: none !important; display: block !important; }';
  document.head.appendChild(style);
})();

function formatSignTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function initEditor() {
  try {
    var res = await fetch(API + '/documents/' + docId + '/editor-config');
    if (!res.ok) throw new Error(await res.text());
    var config = await res.json();

    document.getElementById('docTitle').textContent = config.document.title;

    var isView = config.editorConfig && config.editorConfig.mode === 'view';
    document.getElementById('btnSign').style.display = isView ? 'none' : '';
    document.getElementById('btnDownloadPdf').style.display = isView ? '' : 'none';

    if (isView) {
      try {
        var metaRes = await fetch(API + '/documents/' + docId);
        if (metaRes.ok) {
          var meta = await metaRes.json();
          var banner = document.getElementById('signedBanner');
          var signer = meta.signer || '—';
          var time = formatSignTime(meta.signature_time);
          banner.textContent = 'Документ подписан. Подписант: ' + signer +
            (time ? '. Время подписания: ' + time : '') + '. Режим просмотра.';
          banner.style.display = '';
        }
      } catch (e) {}
    }

    var toolbarEl = document.querySelector('.editor-toolbar');
    var bannerEl = document.getElementById('signedBanner');
    var chrome = (toolbarEl ? toolbarEl.offsetHeight : 48) + (bannerEl && bannerEl.style.display !== 'none' ? bannerEl.offsetHeight : 0);
    config.height = (window.innerHeight - chrome) + 'px';
    config.width = '100%';

    new DocsAPI.DocEditor('editor-container', config);

    function applyFrameHeight() {
      var frame = document.querySelector('iframe[name="frameEditor"]');
      if (!frame) return;
      var tb = document.querySelector('.editor-toolbar');
      var bn = document.getElementById('signedBanner');
      var h = (tb ? tb.offsetHeight : 48) + (bn && bn.style.display !== 'none' ? bn.offsetHeight : 0);
      frame.style.setProperty('height', (window.innerHeight - h) + 'px', 'important');
    }

    var attempts = 0;
    var timer = setInterval(function() {
      applyFrameHeight();
      attempts++;
      if (attempts > 150) clearInterval(timer);
    }, 200);

    window.addEventListener('resize', applyFrameHeight);
  } catch (e) {
    document.getElementById('docTitle').textContent = 'Ошибка загрузки: ' + e.message;
  }
}

function signDoc() {
  if (!window.RbSignLocal) {
    toast('Модуль подписания не загружен', 'error');
    return;
  }
  RbSignLocal.showCertificateDialog(docId, function (data) {
    toast('Документ подписан: ' + ((data && data.signer) || ''));
    setTimeout(function () { location.reload(); }, 1200);
  });
}

function downloadPdf() {
  window.location.href = API + '/documents/' + docId + '/download-pdf';
}

async function verifyDoc() {
  var btn = document.getElementById('btnVerify');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Проверка...';
  try {
    var res = await fetch(API + '/documents/' + docId + '/verify', { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    var data = await res.json();
    showModal('Результат проверки подписи', data);
  } catch (e) {
    toast('Ошибка проверки: ' + e.message, 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Проверить подпись';
}
</script>
</body>
</html>
